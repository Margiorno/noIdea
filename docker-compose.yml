version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_NODE_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - noidea-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  axonserver:
    image: axoniq/axonserver:latest
    hostname: axonserver
    volumes:
      - axonserver-data:/data
      - axonserver-eventdata:/eventdata
    ports:
      - "${AXON_DASHBOARD_PORT}:8024"
      - "${AXON_GRPC_PORT}:8124"
    networks:
      - noidea-network
    environment:
      - 'AXONIQ_AXONSERVER_STANDALONE=TRUE'

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_INTERNAL_PORT}"
    networks:
      - noidea-network
    depends_on:
      - identity-service
      - movie-catalog-service
      - activity-tracking-query-service
      - activity-tracking-command-service
    environment:
      SERVER_PORT: ${API_GATEWAY_INTERNAL_PORT}

      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      IDENTITY_SERVICE_URI: http://identity-service:${IDENTITY_SERVICE_INTERNAL_PORT}/graphql
      MOVIE_CATALOG_SERVICE_URI: http://movie-catalog-service:${MOVIE_CATALOG_SERVICE_INTERNAL_PORT}/graphql
      ACTIVITY_QUERY_SERVICE_URI: http://activity-tracking-query-service:${ACTIVITY_TRACKING_QUERY_SERVICE_INTERNAL_PORT}/graphql
      ACTIVITY_COMMAND_SERVICE_URI: http://activity-tracking-command-service:${ACTIVITY_TRACKING_COMMAND_SERVICE_INTERNAL_PORT}/graphql



  identity-service:
    build: ./identity-service
    container_name: identity-service
    ports:
      - "${IDENTITY_SERVICE_PORT}:${IDENTITY_SERVICE_INTERNAL_PORT}"
    networks:
      - noidea-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: ${IDENTITY_SERVICE_INTERNAL_PORT}

      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APPLICATION_SECURITY_JWT_EXPIRATION: ${JWT_EXPIRATION}
      APPLICATION_ACTION_TOKEN_VERIFICATION_EXPIRATION: ${ACTION_TOKEN_EXPIRATION}

      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_NODE_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}


  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_INTERNAL_PORT}"
    networks:
      - noidea-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: ${NOTIFICATION_SERVICE_INTERNAL_PORT}

      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_NODE_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}

  movie-catalog-service:
    build: ./movie-catalog-service
    container_name: movie-catalog-service
    ports:
      - "${MOVIE_CATALOG_SERVICE_PORT}:${MOVIE_CATALOG_SERVICE_INTERNAL_PORT}"
    networks:
      - noidea-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: ${MOVIE_CATALOG_SERVICE_INTERNAL_PORT}

      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_NODE_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}

  activity-tracking-command-service:
    build: ./activity-tracking-command-service
    container_name: activity-tracking-command-service
    ports:
      - "${ACTIVITY_TRACKING_COMMAND_SERVICE_PORT}:${ACTIVITY_TRACKING_COMMAND_SERVICE_INTERNAL_PORT}"
    networks:
      - noidea-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      axonserver:
        condition: service_started
    environment:
      SERVER_PORT: ${ACTIVITY_TRACKING_COMMAND_SERVICE_INTERNAL_PORT}

      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_NODE_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      AXON_SERVER_ADDRESS: axonserver:${AXON_GRPC_PORT}

  activity-tracking-query-service:
    build: ./activity-tracking-query-service
    container_name: activity-tracking-query-service
    ports:
      - "${ACTIVITY_TRACKING_QUERY_SERVICE_PORT}:${ACTIVITY_TRACKING_QUERY_SERVICE_INTERNAL_PORT}"
    networks:
      - noidea-network
    depends_on:
      axonserver:
        condition: service_started
    environment:
      SERVER_PORT: ${ACTIVITY_TRACKING_QUERY_SERVICE_INTERNAL_PORT}

      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_NODE_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS}
      AXON_SERVER_ADDRESS: axonserver:${AXON_GRPC_PORT}

networks:
  noidea-network:
    driver: bridge

volumes:
  axonserver-data:
  axonserver-eventdata: